<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse — Social</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c27;
    --surface3: #242433;
    --border: #2a2a3d;
    --accent: #7c5cfc;
    --accent2: #fc5c7d;
    --accent3: #5cf0c0;
    --text: #f0f0f8;
    --text2: #9090b0;
    --text3: #5a5a7a;
    --liked: #fc5c7d;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --glow: 0 0 24px rgba(124,92,252,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  h1,h2,h3,h4 { font-family: 'Syne', sans-serif; }

  /* --- LAYOUT --- */
  #app { display: flex; min-height: 100vh; }
  #sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    display: flex; flex-direction: column;
    z-index: 100;
    padding: 0;
  }
  #main-content {
    margin-left: 260px;
    flex: 1;
    max-width: 680px;
    padding: 32px 24px;
    min-height: 100vh;
  }
  #right-panel {
    width: 300px;
    position: fixed;
    top: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 28px 20px;
    overflow-y: auto;
  }

  /* --- SIDEBAR --- */
  .sidebar-logo {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .sidebar-logo span { font-size: 12px; color: var(--text3); font-weight: 400; font-family: 'DM Sans', sans-serif; }
  .nav-section { padding: 20px 16px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: var(--text2);
    font-weight: 500;
    transition: all 0.2s;
    margin-bottom: 4px;
    font-size: 14.5px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: rgba(124,92,252,0.15); color: var(--accent); }
  .nav-item .icon { font-size: 18px; width: 22px; text-align: center; }
  .sidebar-user {
    padding: 16px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
  }
  .sidebar-user:hover { background: var(--surface2); }
  .sidebar-user .info { flex: 1; overflow: hidden; }
  .sidebar-user .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-user .handle { font-size: 12px; color: var(--text3); }

  /* --- AVATAR --- */
  .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
    border: 2px solid var(--border);
  }
  .avatar.sm { width: 32px; height: 32px; font-size: 13px; }
  .avatar.lg { width: 80px; height: 80px; font-size: 28px; border-width: 3px; }
  .avatar.xl { width: 100px; height: 100px; font-size: 36px; border-width: 3px; }

  /* --- PAGES --- */
  .page { display: none; }
  .page.active { display: block; }

  /* --- FEED --- */
  .feed-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .feed-header h2 { font-size: 22px; font-weight: 700; }
  .tab-switch {
    display: flex; gap: 4px;
    background: var(--surface2);
    padding: 4px;
    border-radius: 10px;
  }
  .tab-btn {
    padding: 6px 16px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active { background: var(--accent); color: #fff; }

  /* --- COMPOSE --- */
  .compose-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  .compose-box:focus-within { border-color: var(--accent); box-shadow: var(--glow); }
  .compose-inner { display: flex; gap: 14px; }
  .compose-textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    resize: none;
    min-height: 60px;
    line-height: 1.6;
  }
  .compose-textarea::placeholder { color: var(--text3); }
  .compose-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .compose-actions { display: flex; gap: 8px; }
  .compose-hint { font-size: 12px; color: var(--text3); }
  .char-count { font-size: 12px; color: var(--text3); }
  .char-count.warn { color: var(--accent2); }

  /* --- POST CARD --- */
  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    transition: border-color 0.2s, transform 0.2s;
    animation: slideIn 0.3s ease;
  }
  .post-card:hover { border-color: var(--border); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .post-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
  .post-author { display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .post-author:hover .author-name { color: var(--accent); }
  .author-name { font-weight: 600; font-size: 14px; font-family: 'Syne', sans-serif; }
  .author-handle { font-size: 12px; color: var(--text3); }
  .post-time { font-size: 11px; color: var(--text3); }
  .post-body { font-size: 15px; line-height: 1.65; margin-bottom: 16px; color: #dcdcf0; }
  .post-tag {
    display: inline-block;
    background: rgba(124,92,252,0.12);
    color: var(--accent);
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-right: 4px;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .post-actions {
    display: flex; gap: 4px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 4px;
  }
  .action-btn {
    display: flex; align-items: center; gap: 6px;
    background: transparent;
    border: none;
    color: var(--text3);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .action-btn:hover { background: var(--surface2); color: var(--text2); }
  .action-btn.liked { color: var(--liked); }
  .action-btn.liked:hover { background: rgba(252,92,125,0.1); }
  .action-btn .count { font-size: 13px; }

  /* --- COMMENTS --- */
  .comments-section {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .comments-section.open { display: block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .comment-item {
    display: flex; gap: 10px;
    margin-bottom: 12px;
    animation: slideIn 0.2s ease;
  }
  .comment-body { flex: 1; }
  .comment-author { font-weight: 600; font-size: 13px; font-family: 'Syne', sans-serif; }
  .comment-text { font-size: 13.5px; color: #c0c0d8; line-height: 1.5; }
  .comment-time { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .comment-input-row {
    display: flex; gap: 10px; align-items: center;
    margin-top: 12px;
  }
  .comment-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .comment-input:focus { border-color: var(--accent); }
  .comment-input::placeholder { color: var(--text3); }

  /* --- BUTTONS --- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6a4bea; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(124,92,252,0.4); }
  .btn-outline { background: transparent; color: var(--text2); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-follow { background: var(--accent); color: #fff; padding: 7px 16px; font-size: 13px; border-radius: 8px; }
  .btn-follow.following { background: transparent; border: 1px solid var(--border); color: var(--text2); }
  .btn-follow.following:hover { border-color: var(--accent2); color: var(--accent2); }
  .btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 8px; }
  .btn-ghost { background: transparent; color: var(--text3); border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 4px 8px; transition: color 0.2s; }
  .btn-ghost:hover { color: var(--text); }
  .btn-icon { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); width: 36px; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 0.2s; }
  .btn-icon:hover { border-color: var(--accent); color: var(--accent); }

  /* --- PROFILE PAGE --- */
  .profile-hero {
    position: relative;
    margin-bottom: 60px;
  }
  .profile-banner {
    height: 180px;
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 0;
  }
  .profile-avatar-wrap {
    position: absolute;
    bottom: -48px;
    left: 24px;
  }
  .profile-avatar-wrap .avatar { border: 4px solid var(--bg); }
  .profile-info { padding: 56px 24px 0; }
  .profile-name { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .profile-handle { color: var(--text3); font-size: 14px; margin-bottom: 10px; }
  .profile-bio { font-size: 14.5px; color: var(--text2); line-height: 1.6; margin-bottom: 16px; max-width: 420px; }
  .profile-meta { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .profile-meta span { font-size: 13px; color: var(--text3); display: flex; align-items: center; gap: 5px; }
  .profile-stats { display: flex; gap: 24px; margin-bottom: 24px; }
  .stat-item { text-align: center; cursor: pointer; }
  .stat-item:hover .stat-num { color: var(--accent); }
  .stat-num { font-size: 20px; font-weight: 700; font-family: 'Syne', sans-serif; display: block; }
  .stat-label { font-size: 12px; color: var(--text3); }
  .profile-actions { display: flex; gap: 10px; margin-bottom: 28px; }

  /* --- EXPLORE --- */
  .search-bar {
    position: relative;
    margin-bottom: 24px;
  }
  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px 12px 44px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: var(--glow); }
  .search-input::placeholder { color: var(--text3); }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: var(--text3); pointer-events: none; }
  .trending-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .trend-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .trend-tag:hover { border-color: var(--accent); color: var(--accent); background: rgba(124,92,252,0.08); }
  .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }

  /* --- USER CARDS --- */
  .user-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 14px;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .user-card:hover { border-color: var(--border); }
  .user-card-info { flex: 1; overflow: hidden; }
  .user-card-name { font-weight: 600; font-size: 14px; font-family: 'Syne', sans-serif; }
  .user-card-handle { font-size: 12px; color: var(--text3); }
  .user-card-bio { font-size: 12.5px; color: var(--text2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* --- RIGHT PANEL --- */
  .panel-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
  .suggested-user {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .suggested-user:last-child { border-bottom: none; }
  .suggested-user:hover .s-name { color: var(--accent); }
  .s-info { flex: 1; overflow: hidden; }
  .s-name { font-size: 13.5px; font-weight: 600; font-family: 'Syne', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-handle { font-size: 11px; color: var(--text3); }
  .trending-section { margin-top: 28px; }
  .trend-item { padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .trend-item:last-child { border-bottom: none; }
  .trend-item:hover .trend-name { color: var(--accent); }
  .trend-name { font-size: 14px; font-weight: 600; color: var(--text); }
  .trend-count { font-size: 12px; color: var(--text3); }

  /* --- AUTH SCREEN --- */
  #auth-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow);
  }
  .auth-logo { text-align: center; margin-bottom: 8px; }
  .auth-logo h1 {
    font-size: 40px; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .auth-subtitle { text-align: center; color: var(--text3); font-size: 14px; margin-bottom: 32px; }
  .auth-tabs { display: flex; background: var(--surface2); border-radius: 10px; padding: 4px; margin-bottom: 28px; }
  .auth-tab { flex: 1; text-align: center; padding: 9px; border-radius: 8px; cursor: pointer; color: var(--text2); font-size: 14px; font-weight: 500; transition: all 0.2s; }
  .auth-tab.active { background: var(--accent); color: #fff; }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 7px; }
  .form-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--text3); }
  .auth-error { color: var(--accent2); font-size: 13px; margin-top: 10px; text-align: center; min-height: 20px; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text3); }

  /* --- MODAL --- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    z-index: 500;
    padding: 20px;
    display: none;
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s ease; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
    box-shadow: var(--shadow);
    animation: slideIn 0.3s ease;
  }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .modal-title { font-size: 20px; font-weight: 700; }
  .modal-close { background: none; border: none; color: var(--text3); font-size: 22px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--text); }

  /* --- TOAST --- */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
  .toast {
    background: var(--surface3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13.5px;
    box-shadow: var(--shadow);
    animation: slideIn 0.3s ease;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.success { border-left: 3px solid var(--accent3); }
  .toast.error { border-left: 3px solid var(--accent2); }
  .toast.info { border-left: 3px solid var(--accent); }

  /* --- BADGE --- */
  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 20px;
    min-width: 18px;
    text-align: center;
  }

  /* --- NOTIFICATIONS --- */
  .notif-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    animation: slideIn 0.3s ease;
  }
  .notif-item.unread { border-color: rgba(124,92,252,0.3); background: rgba(124,92,252,0.05); }
  .notif-icon { font-size: 20px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface2); }
  .notif-text { flex: 1; font-size: 14px; }
  .notif-text strong { color: var(--text); }
  .notif-time { font-size: 12px; color: var(--text3); margin-top: 3px; }

  /* --- GRADIENT BANNERS --- */
  .banner-1 { background: linear-gradient(135deg, #1a0a2e, #2d1a4a, #1a0a3a); }
  .banner-2 { background: linear-gradient(135deg, #0a1a2e, #1a2d4a, #0a2030); }
  .banner-3 { background: linear-gradient(135deg, #1a2a0a, #2a3a1a, #1a2a0a); }
  .banner-4 { background: linear-gradient(135deg, #2a0a1a, #3a1a2a, #2a0a1a); }

  /* COLORS FOR AVATARS */
  .av-purple { background: linear-gradient(135deg, #7c5cfc, #a080ff); color: #fff; }
  .av-pink { background: linear-gradient(135deg, #fc5c7d, #ff80a0); color: #fff; }
  .av-teal { background: linear-gradient(135deg, #5cf0c0, #40d4a8); color: #0a0a1a; }
  .av-orange { background: linear-gradient(135deg, #fc9c5c, #ffc080); color: #fff; }
  .av-blue { background: linear-gradient(135deg, #5c9cfc, #80c0ff); color: #fff; }
  .av-green { background: linear-gradient(135deg, #5cfc7c, #80ffa0); color: #0a0a1a; }

  /* Utilities */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .items-center { align-items: center; }
  .gap-2 { gap: 8px; }
  .gap-3 { gap: 12px; }
  .mt-2 { margin-top: 8px; }
  .mt-4 { margin-top: 16px; }
  .mb-4 { margin-bottom: 16px; }
  .text-accent { color: var(--accent); }
  .text-muted { color: var(--text3); }
  .text-sm { font-size: 13px; }
  .font-bold { font-weight: 700; }
  .empty-state { text-align: center; padding: 48px 24px; color: var(--text3); }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state p { font-size: 15px; }

<body>

<script>
// ===================== DATABASE =====================
const DB = {
  users: [
    { id: 'u1', username: 'alex', name: 'Alex Rivera', password: '1234', email: 'alex@pulse.io', bio: 'Designer & Creative Technologist. Building beautiful things. ✨', avatar: 'av-purple', initials: 'AR', location: 'San Francisco, CA', website: 'alexrivera.design', joined: '2023-01', followers: ['u2','u3'], following: ['u2','u3'] },
    { id: 'u2', username: 'maya', name: 'Maya Chen', password: '1234', email: 'maya@pulse.io', bio: 'Full-stack dev 🛠️ | Open source contributor | Coffee enthusiast ☕', avatar: 'av-teal', initials: 'MC', location: 'New York, NY', website: 'mayachen.dev', joined: '2023-03', followers: ['u1'], following: ['u1','u3'] },
    { id: 'u3', username: 'dev', name: 'Dev Patel', password: '1234', email: 'dev@pulse.io', bio: 'Building the future one commit at a time 🚀 | ML Researcher | Speaker', avatar: 'av-orange', initials: 'DP', location: 'London, UK', website: '', joined: '2023-06', followers: ['u1','u2'], following: ['u1'] },
    { id: 'u4', username: 'luna', name: 'Luna Martinez', password: '1234', email: 'luna@pulse.io', bio: 'Photographer 📷 | Traveler | Visual storyteller', avatar: 'av-pink', initials: 'LM', location: 'Barcelona, Spain', website: '', joined: '2023-08', followers: [], following: ['u1','u2'] },
    { id: 'u5', username: 'zara', name: 'Zara Kim', password: '1234', email: 'zara@pulse.io', bio: 'Product manager at TechCo | Strategy & Growth | Former founder', avatar: 'av-blue', initials: 'ZK', location: 'Seoul, Korea', website: '', joined: '2023-09', followers: ['u3'], following: ['u1'] },
  ],
  posts: [
    { id: 'p1', userId: 'u2', content: 'Just shipped a new feature that cuts our API response time by 60%. Sometimes the best optimization is just removing unnecessary abstractions. 🚀 #webdev #performance', likes: ['u1','u3'], comments: [], createdAt: new Date(Date.now()-3600000*2) },
    { id: 'p2', userId: 'u3', content: 'Hot take: The best documentation is code that doesn\'t need documentation. Write clear variable names, small focused functions, and let the code speak for itself. What do you think? #coding #devlife', likes: ['u1','u2'], comments: [], createdAt: new Date(Date.now()-3600000*5) },
    { id: 'p3', userId: 'u1', content: 'Working on a new design system today. The hardest part isn\'t the components — it\'s establishing the right naming conventions that everyone agrees on. Consistency is everything. ✨ #design #ux', likes: ['u2','u3','u4'], comments: [], createdAt: new Date(Date.now()-3600000*8) },
    { id: 'p4', userId: 'u4', content: 'Golden hour in Barcelona is unlike anything else in the world. The light hits the Sagrada Família at 6:47pm and it\'s pure magic every single time. 🏛️ #travel #photography', likes: ['u1','u2','u3','u5'], comments: [], createdAt: new Date(Date.now()-3600000*12) },
    { id: 'p5', userId: 'u5', content: 'Reminder: Your roadmap is a living document, not a contract. The best product teams I\'ve seen update their roadmap weekly based on new learnings. Stay nimble. 🎯 #product #startup', likes: ['u1','u3'], comments: [], createdAt: new Date(Date.now()-3600000*18) },
    { id: 'p6', userId: 'u2', content: 'Just discovered that 90% of our users never used half the features we spent 3 months building. Data > assumptions. Always. #product #lessons', likes: ['u1','u3','u5'], comments: [], createdAt: new Date(Date.now()-3600000*24) },
  ],
  comments: [
    { id: 'c1', postId: 'p1', userId: 'u1', text: 'That\'s incredible! What was the main bottleneck?', createdAt: new Date(Date.now()-3600000*1.5) },
    { id: 'c2', postId: 'p1', userId: 'u3', text: 'n+1 queries are the silent killer. Good job hunting them down!', createdAt: new Date(Date.now()-3600000*1) },
    { id: 'c3', postId: 'p3', userId: 'u2', text: 'Token naming is the eternal debate. BEM vs camelCase vs... 😅', createdAt: new Date(Date.now()-3600000*7) },
  ],
  notifications: [],
  nextId: 100,
};

// Add comments to posts
DB.comments.forEach(c => {
  const post = DB.posts.find(p => p.id === c.postId);
  if (post) post.comments.push(c.id);
});

let currentUser = null;
let currentFeedTab = 'for-you';
let notifications = [];

// ===================== AUTH =====================
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
}

function handleLogin() {
  const u = document.getElementById('login-username').value.trim();
  const p = document.getElementById('login-password').value;
  const user = DB.users.find(x => (x.username === u || x.email === u) && x.password === p);
  if (!user) { document.getElementById('login-error').textContent = 'Invalid credentials. Try: alex/1234, maya/1234, dev/1234'; return; }
  loginUser(user);
}

function handleRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const username = document.getElementById('reg-username').value.trim().replace('@','');
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const bio = document.getElementById('reg-bio').value.trim();
  const err = document.getElementById('reg-error');
  if (!name||!username||!email||!password) { err.textContent = 'All fields except bio are required.'; return; }
  if (password.length < 4) { err.textContent = 'Password must be at least 4 characters.'; return; }
  if (DB.users.find(u => u.username === username)) { err.textContent = 'Username already taken.'; return; }
  if (DB.users.find(u => u.email === email)) { err.textContent = 'Email already registered.'; return; }
  const avatars = ['av-purple','av-pink','av-teal','av-orange','av-blue','av-green'];
  const newUser = {
    id: 'u' + (++DB.nextId),
    username, name, password, email, bio,
    avatar: avatars[Math.floor(Math.random()*avatars.length)],
    initials: name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase(),
    location: '', website: '',
    joined: new Date().toISOString().substring(0,7),
    followers: [], following: []
  };
  DB.users.push(newUser);
  loginUser(newUser);
  showToast('Welcome to Pulse! 🎉', 'success');
}

function loginUser(user) {
  currentUser = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('sidebar-name').textContent = user.name;
  document.getElementById('sidebar-handle').textContent = '@' + user.username;
  const av = (el, u) => { el.className = `avatar ${u.avatar}`; el.textContent = u.initials; };
  av(document.getElementById('sidebar-avatar'), user);
  av(document.getElementById('compose-avatar'), user);
  renderFeed();
  renderSuggestedUsers();
  renderTrending();
  renderNotifications();
  // Seed some notifications
  if (notifications.length === 0) {
    notifications = [
      { id: 'n1', type: 'like', fromId: 'u2', postId: 'p3', text: 'liked your post', read: false, time: new Date(Date.now()-3600000*1) },
      { id: 'n2', type: 'comment', fromId: 'u3', postId: 'p3', text: 'commented on your post', read: false, time: new Date(Date.now()-3600000*2) },
      { id: 'n3', type: 'follow', fromId: 'u4', postId: null, text: 'started following you', read: true, time: new Date(Date.now()-3600000*6) },
    ].filter(n => n.fromId !== currentUser.id);
  }
  updateNotifBadge();
}

// ===================== NAVIGATION =====================
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'notifications') { renderNotifications(); }
  if (name === 'explore') { renderExplore(); }
}

function showMyProfile() {
  showProfilePage(currentUser.id);
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('nav-profile').classList.add('active');
}

function showProfilePage(userId) {
  const user = DB.users.find(u => u.id === userId);
  if (!user) return;
  showPage('profile');
  renderProfilePage(user);
}

// ===================== FEED =====================
function switchFeedTab(tab, btn) {
  currentFeedTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed();
}

function renderFeed() {
  let posts = [...DB.posts];
  if (currentFeedTab === 'following') {
    posts = posts.filter(p => currentUser.following.includes(p.userId) || p.userId === currentUser.id);
  }
  posts.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const container = document.getElementById('feed-posts');
  if (posts.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">👋</div><p>No posts yet. Follow some people or be the first to post!</p></div>`;
    return;
  }
  container.innerHTML = posts.map(p => renderPostCard(p)).join('');
}

function renderPostCard(post) {
  const user = DB.users.find(u => u.id === post.userId);
  if (!user) return '';
  const liked = post.likes.includes(currentUser.id);
  const commentObjs = DB.comments.filter(c => c.postId === post.id);
  const content = post.content.replace(/#(\w+)/g, '<span class="post-tag" onclick="searchTag(\'$1\')">#$1</span>');
  const commentsHtml = commentObjs.map(c => {
    const cu = DB.users.find(u => u.id === c.userId);
    if (!cu) return '';
    return `<div class="comment-item">
      <div class="avatar sm ${cu.avatar}">${cu.initials}</div>
      <div class="comment-body">
        <span class="comment-author">${cu.name}</span>
        <span class="text-muted text-sm" style="margin-left:6px">@${cu.username}</span>
        <div class="comment-text">${c.text}</div>
        <div class="comment-time">${timeAgo(c.createdAt)}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="post-card" id="post-${post.id}">
    <div class="post-header">
      <div class="post-author" onclick="showProfilePage('${user.id}')">
        <div class="avatar ${user.avatar}">${user.initials}</div>
        <div>
          <div class="author-name">${user.name}</div>
          <div class="author-handle">@${user.username}</div>
        </div>
      </div>
      <span class="post-time">${timeAgo(post.createdAt)}</span>
    </div>
    <div class="post-body">${content}</div>
    <div class="post-actions">
      <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
        ${liked ? '❤️' : '🤍'} <span class="count" id="likes-${post.id}">${post.likes.length}</span>
      </button>
      <button class="action-btn" onclick="toggleComments('${post.id}')">
        💬 <span class="count">${post.comments.length}</span>
      </button>
      <button class="action-btn" onclick="sharePost('${post.id}')">↗️ Share</button>
      ${post.userId === currentUser.id ? `<button class="action-btn" onclick="deletePost('${post.id}')" style="margin-left:auto;color:var(--accent2)">🗑️ Delete</button>` : ''}
    </div>
    <div class="comments-section" id="comments-${post.id}">
      ${commentsHtml}
      <div class="comment-input-row">
        <div class="avatar sm ${currentUser.avatar}">${currentUser.initials}</div>
        <input class="comment-input" id="comment-input-${post.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter')submitComment('${post.id}')">
        <button class="btn btn-primary btn-sm" onclick="submitComment('${post.id}')">Post</button>
      </div>
    </div>
  </div>`;
}

function submitPost() {
  const ta = document.getElementById('post-textarea');
  const content = ta.value.trim();
  if (!content) { showToast('Write something first!', 'error'); return; }
  const post = {
    id: 'p' + (++DB.nextId),
    userId: currentUser.id,
    content,
    likes: [],
    comments: [],
    createdAt: new Date()
  };
  DB.posts.unshift(post);
  ta.value = '';
  updateCharCount(ta);
  renderFeed();
  showToast('Post published! ✨', 'success');
}

function toggleLike(postId) {
  const post = DB.posts.find(p => p.id === postId);
  if (!post) return;
  const idx = post.likes.indexOf(currentUser.id);
  if (idx === -1) {
    post.likes.push(currentUser.id);
    // Add notification if not own post
    if (post.userId !== currentUser.id) {
      addNotification('like', post.userId, postId, 'liked your post');
    }
  } else {
    post.likes.splice(idx, 1);
  }
  // Update button in-place
  const btn = document.querySelector(`#post-${postId} .action-btn`);
  const liked = post.likes.includes(currentUser.id);
  btn.className = `action-btn ${liked ? 'liked' : ''}`;
  btn.innerHTML = `${liked ? '❤️' : '🤍'} <span class="count" id="likes-${postId}">${post.likes.length}</span>`;
}

function toggleComments(postId) {
  const section = document.getElementById('comments-' + postId);
  section.classList.toggle('open');
}

function submitComment(postId) {
  const input = document.getElementById('comment-input-' + postId);
  const text = input.value.trim();
  if (!text) return;
  const post = DB.posts.find(p => p.id === postId);
  const comment = { id: 'c'+(++DB.nextId), postId, userId: currentUser.id, text, createdAt: new Date() };
  DB.comments.push(comment);
  post.comments.push(comment.id);
  input.value = '';
  if (post.userId !== currentUser.id) {
    addNotification('comment', post.userId, postId, 'commented on your post');
  }
  // Re-render just that post
  const postEl = document.getElementById('post-' + postId);
  if (postEl) {
    const newHtml = renderPostCard(post);
    postEl.outerHTML = newHtml;
    const newEl = document.getElementById('post-' + postId);
    const cs = newEl.querySelector('.comments-section');
    if (cs) cs.classList.add('open');
  }
  showToast('Comment posted!', 'success');
}

function deletePost(postId) {
  if (!confirm('Delete this post?')) return;
  const idx = DB.posts.findIndex(p => p.id === postId);
  if (idx !== -1) DB.posts.splice(idx, 1);
  renderFeed();
  showToast('Post deleted.', 'info');
}

function sharePost(postId) {
  showToast('Link copied to clipboard! 🔗', 'info');
}

function updateCharCount(ta) {
  const rem = 280 - ta.value.length;
  const el = document.getElementById('char-count');
  el.textContent = rem;
  el.classList.toggle('warn', rem < 30);
}

function addHashtag() {
  const ta = document.getElementById('post-textarea');
  ta.value += (ta.value ? ' ' : '') + '#';
  ta.focus();
}

// ===================== PROFILE =====================
function renderProfilePage(user) {
  const isMe = user.id === currentUser.id;
  const isFollowing = currentUser.following.includes(user.id);
  const userPosts = DB.posts.filter(p => p.userId === user.id).sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
  const banners = ['banner-1','banner-2','banner-3','banner-4'];
  const bannerClass = banners[user.id.charCodeAt(1) % banners.length];
  const locationHtml = user.location ? `<span>📍 ${user.location}</span>` : '';
  const websiteHtml = user.website ? `<span>🔗 ${user.website}</span>` : '';
  const joinedHtml = `<span>📅 Joined ${user.joined}</span>`;
  document.getElementById('profile-content').innerHTML = `
    <div class="profile-hero">
      <div class="profile-banner ${bannerClass}"></div>
      <div class="profile-avatar-wrap">
        <div class="avatar xl ${user.avatar}">${user.initials}</div>
      </div>
    </div>
    <div class="profile-info">
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        ${isMe ? `<button class="btn btn-outline" onclick="openEditProfile()">✏️ Edit Profile</button>` 
               : `<button class="btn btn-follow ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${user.id}')" id="follow-btn-${user.id}">${isFollowing ? 'Following' : '+ Follow'}</button>`}
      </div>
      <div class="profile-name">${user.name}</div>
      <div class="profile-handle">@${user.username}</div>
      ${user.bio ? `<div class="profile-bio">${user.bio}</div>` : ''}
      <div class="profile-meta">${locationHtml}${websiteHtml}${joinedHtml}</div>
      <div class="profile-stats">
        <div class="stat-item">
          <span class="stat-num">${userPosts.length}</span>
          <span class="stat-label">Posts</span>
        </div>
        <div class="stat-item" onclick="showFollowersModal('${user.id}','followers')">
          <span class="stat-num">${user.followers.length}</span>
          <span class="stat-label">Followers</span>
        </div>
        <div class="stat-item" onclick="showFollowersModal('${user.id}','following')">
          <span class="stat-num">${user.following.length}</span>
          <span class="stat-label">Following</span>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <div id="profile-posts">
      ${userPosts.length === 0 
        ? `<div class="empty-state"><div class="icon">📝</div><p>${isMe ? "You haven't posted yet." : user.name + " hasn't posted yet."}</p></div>` 
        : userPosts.map(p => renderPostCard(p)).join('')}
    </div>`;
}

function toggleFollow(userId) {
  const user = DB.users.find(u => u.id === userId);
  if (!user || userId === currentUser.id) return;
  const myIdx = currentUser.following.indexOf(userId);
  if (myIdx === -1) {
    currentUser.following.push(userId);
    user.followers.push(currentUser.id);
    addNotification('follow', userId, null, 'started following you');
    showToast(`You're now following ${user.name}!`, 'success');
  } else {
    currentUser.following.splice(myIdx, 1);
    const theirIdx = user.followers.indexOf(currentUser.id);
    if (theirIdx !== -1) user.followers.splice(theirIdx, 1);
    showToast(`Unfollowed ${user.name}.`, 'info');
  }
  // Update button
  const btn = document.getElementById('follow-btn-' + userId);
  if (btn) {
    const nowFollowing = currentUser.following.includes(userId);
    btn.className = `btn btn-follow ${nowFollowing ? 'following' : ''}`;
    btn.textContent = nowFollowing ? 'Following' : '+ Follow';
  }
  renderSuggestedUsers();
  // Update stats if on profile page
  if (document.getElementById('page-profile').classList.contains('active')) {
    renderProfilePage(user);
  }
}

function openEditProfile() {
  document.getElementById('edit-name').value = currentUser.name;
  document.getElementById('edit-bio').value = currentUser.bio;
  document.getElementById('edit-location').value = currentUser.location;
  document.getElementById('edit-website').value = currentUser.website;
  openModal('edit-profile-modal');
}

function saveProfile() {
  currentUser.name = document.getElementById('edit-name').value.trim() || currentUser.name;
  currentUser.bio = document.getElementById('edit-bio').value.trim();
  currentUser.location = document.getElementById('edit-location').value.trim();
  currentUser.website = document.getElementById('edit-website').value.trim();
  currentUser.initials = currentUser.name.split(' ').map(n=>n[0]).join('').substring(0,2).toUpperCase();
  document.getElementById('sidebar-name').textContent = currentUser.name;
  document.getElementById('sidebar-handle').textContent = '@' + currentUser.username;
  const sav = document.getElementById('sidebar-avatar');
  sav.textContent = currentUser.initials;
  closeModal('edit-profile-modal');
  renderProfilePage(currentUser);
  showToast('Profile updated! ✨', 'success');
}

// ===================== EXPLORE =====================
function renderExplore() {
  const others = DB.users.filter(u => u.id !== currentUser.id);
  document.getElementById('explore-users').innerHTML = others.map(u => renderUserCard(u)).join('');
  // Trending tags
  const tagCounts = {};
  DB.posts.forEach(p => {
    const tags = p.content.match(/#(\w+)/g) || [];
    tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  const sorted = Object.entries(tagCounts).sort((a,b) => b[1]-a[1]).slice(0,10);
  document.getElementById('trending-tags').innerHTML = sorted.map(([tag,count]) =>
    `<span class="trend-tag" onclick="searchTag('${tag.slice(1)}')">${tag} <span style="color:var(--text3)">${count}</span></span>`
  ).join('');
}

function renderUserCard(user) {
  const isFollowing = currentUser.following.includes(user.id);
  return `<div class="user-card">
    <div class="avatar ${user.avatar}" onclick="showProfilePage('${user.id}')">${user.initials}</div>
    <div class="user-card-info" onclick="showProfilePage('${user.id}')">
      <div class="user-card-name">${user.name}</div>
      <div class="user-card-handle">@${user.username}</div>
      <div class="user-card-bio">${user.bio || 'No bio yet'}</div>
    </div>
    <button class="btn btn-follow ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${user.id}')" id="follow-btn-${user.id}">${isFollowing ? 'Following' : '+ Follow'}</button>
  </div>`;
}

function handleSearch(q) {
  const query = q.toLowerCase().trim();
  document.getElementById('trending-section').style.display = query ? 'none' : 'block';
  const searchResultsUsers = document.getElementById('search-results-users');
  const searchResultsPosts = document.getElementById('search-results-posts');
  if (!query) { searchResultsUsers.innerHTML = ''; searchResultsPosts.innerHTML = ''; return; }
  const users = DB.users.filter(u => u.id !== currentUser.id && (u.name.toLowerCase().includes(query) || u.username.toLowerCase().includes(query) || (u.bio||'').toLowerCase().includes(query)));
  const posts = DB.posts.filter(p => p.content.toLowerCase().includes(query));
  searchResultsUsers.innerHTML = users.length ? `<p class="section-title mb-4">Users</p>` + users.map(u => renderUserCard(u)).join('') : '';
  searchResultsPosts.innerHTML = posts.length ? `<p class="section-title mb-4 mt-4">Posts</p>` + posts.map(p => renderPostCard(p)).join('') : '';
  if (!users.length && !posts.length) {
    searchResultsUsers.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No results for "${q}"</p></div>`;
  }
}

function searchTag(tag) {
  showPage('explore');
  document.getElementById('search-input').value = '#' + tag;
  handleSearch('#' + tag);
}

// ===================== SUGGESTIONS & TRENDING =====================
function renderSuggestedUsers() {
  const others = DB.users.filter(u => u.id !== currentUser.id && !currentUser.following.includes(u.id)).slice(0,4);
  document.getElementById('suggested-users').innerHTML = others.length 
    ? others.map(u => `<div class="suggested-user" onclick="showProfilePage('${u.id}')">
        <div class="avatar sm ${u.avatar}">${u.initials}</div>
        <div class="s-info"><div class="s-name">${u.name}</div><div class="s-handle">@${u.username}</div></div>
        <button class="btn btn-follow" onclick="event.stopPropagation();toggleFollow('${u.id}')" id="follow-btn-${u.id}">+ Follow</button>
      </div>`).join('')
    : `<p class="text-muted text-sm">You're following everyone!</p>`;
}

function renderTrending() {
  const tagCounts = {};
  DB.posts.forEach(p => {
    const tags = p.content.match(/#(\w+)/g) || [];
    tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; });
  });
  const sorted = Object.entries(tagCounts).sort((a,b) => b[1]-a[1]).slice(0,5);
  document.getElementById('trending-list').innerHTML = sorted.map(([tag,count]) =>
    `<div class="trend-item" onclick="searchTag('${tag.slice(1)}')">
      <div class="trend-name">${tag}</div>
      <div class="trend-count">${count} posts</div>
    </div>`).join('');
}

// ===================== NOTIFICATIONS =====================
function addNotification(type, toUserId, postId, text) {
  if (toUserId !== currentUser.id) return;
  notifications.unshift({ id: 'n'+(++DB.nextId), type, fromId: currentUser.id, postId, text, read: false, time: new Date() });
  updateNotifBadge();
}

function updateNotifBadge() {
  const unread = notifications.filter(n => !n.read).length;
  const badge = document.getElementById('notif-badge');
  badge.textContent = unread;
  badge.style.display = unread > 0 ? 'inline-block' : 'none';
}

function renderNotifications() {
  const container = document.getElementById('notifications-list');
  if (notifications.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔔</div><p>No notifications yet.</p></div>`;
    return;
  }
  const icons = { like: '❤️', comment: '💬', follow: '👤' };
  container.innerHTML = notifications.map(n => {
    const from = DB.users.find(u => u.id === n.fromId);
    const fromName = from ? from.name : 'Someone';
    return `<div class="notif-item ${n.read ? '' : 'unread'}" onclick="markRead('${n.id}')">
      <div class="notif-icon">${icons[n.type] || '🔔'}</div>
      <div class="notif-text">
        <strong>${fromName}</strong> ${n.text}
        <div class="notif-time">${timeAgo(n.time)}</div>
      </div>
    </div>`;
  }).join('');
}

function markRead(id) {
  const n = notifications.find(x => x.id === id);
  if (n) n.read = true;
  updateNotifBadge();
  renderNotifications();
}

function markAllRead() {
  notifications.forEach(n => n.read = true);
  updateNotifBadge();
  renderNotifications();
}

// ===================== MODAL =====================
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.addEventListener('click', e => {
  if (e.target.classList.contains('modal-overlay')) {
    e.target.classList.remove('open');
  }
});

// ===================== TOAST =====================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  el.innerHTML = `<span>${icons[type]||'ℹ️'}</span> ${msg}`;
  container.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; el.style.transition = 'all 0.3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

// ===================== UTILS =====================
function timeAgo(date) {
  const d = new Date(date);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString('en-US', {month:'short',day:'numeric'});
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
  }
});

// Enter to login
document.getElementById('login-password').addEventListener('keydown', e => { if(e.key==='Enter') handleLogin(); });
</script>
